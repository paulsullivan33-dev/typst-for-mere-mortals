site_name: Typst for Mere Mortals
site_description: A modern typesetting system that turns plain text files into finished PDFs. Markup and code in one language, styles set once and applied everywhere, documents built from your own data, and error messages that point at the exact character, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/typst-for-mere-mortals/
